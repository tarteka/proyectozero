<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .bg { fill: #18181b; }
    .ring { stroke: #fafaf9; }
    .accent { stroke: #e2532d; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #f4f4f5; }
      .ring { stroke: #0b0b0d; }
      .accent { stroke: #f0714e; }
    }
  </style>
  <rect width="100" height="100" rx="22" class="bg"/>
  <circle cx="50" cy="50" r="27" fill="none" class="ring" stroke-width="8"/>
  <line x1="23" y1="77" x2="77" y2="23" class="accent" stroke-width="8" stroke-linecap="round"/>
</svg>
