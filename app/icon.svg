
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 100 100"
     role="img"
     aria-label="Logo personal">

  <style>
    /* Paleta para tema claro */
    .bg { fill: #f4f4f5; }
    .symbol { stroke: #18181b; }
    .slash { stroke: #e2532d; }

    /* Paleta para tema oscuro */
    @media (prefers-color-scheme: dark) {
      .bg { fill: #121418; }
      .symbol { stroke: #fafaf9; }
      .slash { stroke: #ff5935; }
    }
  </style>

  <defs>
    <!-- Recorta el anillo debajo de la diagonal -->
    <mask id="ring-cut">
      <rect width="100" height="100" fill="white"/>
      <path d="M25 75 L75 25"
            stroke="black"
            stroke-width="10"/>
    </mask>
  </defs>

  <!-- Fondo -->
  <rect class="bg"
        width="100" height="100" rx="22"/>

  <!-- Anillo vertical con extremos redondeados -->
  <rect x="31" y="18"
        width="38" height="64" rx="19"
        fill="none"
        class="symbol"
        stroke-width="9"
        mask="url(#ring-cut)"/>

  <!-- Diagonal naranja -->
  <path d="M25 75 L75 25"
        class="slash"
        fill="none"
        stroke-width="9"
        stroke-linecap="round"/>
</svg>
